name: ci

# 全离线：实例都是确定性生成的，没有数据下载、没有模型权重。
# 每个答案都与 HiGHS（经 SciPy）对照，CI 会把这件事重跑一遍。

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 钉版本的这一组只到 3.11：requirements 把 numpy 钉在 1.24.3，而它没有
        # cp312 的 wheel，3.12 上 pip 会转去源码构建并失败（首次推送时 CI 正是在这里红的）。
        # 3.12 / 3.13 由下面的 `unpinned` 作业用最新 numpy/scipy 覆盖，
        # 见 README「诚实边界」第 6 条。
        python-version: ["3.10", "3.11"]
        # Windows 上被管道捕获的 stdout 是 cp1252，中文输出曾让 bench_vsp.py 直接崩；
        # 这一格就是为了让"README 的命令在 Windows 上也能跑"有 CI 兜着。
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: requirements.txt is ASCII-only
        # pip < 23.3 用本机 locale 读它；GBK 的 Windows 上一个中文注释就让安装失败。
        run: python -c "open('requirements.txt','rb').read().decode('ascii')"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Committed benchmark still holds
        run: python bench/bench_all.py --check
      - name: Committed vehicle-scheduling results still hold
        run: python bench/bench_vsp.py --check
      - name: Re-run the random search that found the 6 counterexamples
        # 6000 个实例，本机约 1 分钟。冻结的 6 个种子不是"曾经跑出来过"，
        # 是每次推送都重新搜一遍——命中集合必须**恰好**是 FRACTIONAL_SEEDS，
        # 其中界间隙 > 0 的必须恰好是 FRACTIONAL_SEEDS_WITH_GAP，多一个少一个都红。
        run: python bench/bench_vsp.py --hunt 6000
      - name: Re-run the no-eligibility control group (the 1500 in the abstract)
        # 英文摘要里那个 1500 就是这一步算出来的：同一批实例、去掉场站准入限制，
        # 1500 个里 0 个出分数松弛、0 个有界间隙。本机约 40 秒。
        run: python bench/bench_vsp.py --hunt-baseline 1500
      - name: The solver core needs no SciPy
        # lpmip/ 只依赖 NumPy；SciPy 只用于交叉验证。卸掉它验一次，
        # 免得"自己实现"这句话悄悄靠在参照求解器上。
        run: |
          pip uninstall -y scipy
          python -c "
          import sys; sys.path.insert(0,'.')
          from lpmip.model import Model
          from lpmip import branch_bound as bb
          m = Model(sense='max')
          x = [m.add_var('x%d'%i, 0, 1, integer=True) for i in range(3)]
          m.add_constraint(2*x[0] + 3*x[1] + x[2] <= 5)
          m.set_objective(5*x[0] + 4*x[1] + 3*x[2])
          r = bb.solve(m)
          assert r.status == 'optimal' and abs(r.obj - 9.0) < 1e-9, r
          print('ok: 无 SciPy 也能求解', r.obj)
          "

  unpinned:
    # README「诚实边界」第 6 条的证据：不钉版本、用当时最新的 numpy/scipy，
    # 在钉版本装不上的 Python 上重跑同一套检查。计数、状态、界值一旦漂了，这里先红。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install latest numpy and scipy
        run: |
          pip install numpy scipy
          python -c "import sys, numpy, scipy; print(sys.version.split()[0], numpy.__version__, scipy.__version__)"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Committed results still hold
        run: |
          python bench/bench_all.py --check
          python bench/bench_vsp.py --check
      - name: Both random searches
        run: python bench/bench_vsp.py --hunt 6000 --hunt-baseline 1500
